name: CI

# Runs the test suite on every push / PR. This includes the import-graph check
# (test/imports.test.js), which fails the build if a module imports a named
# export that no shipped module provides — the bug that once bricked the whole
# deployed app. Does not touch deploy (Pages uses "deploy from a branch").
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test
