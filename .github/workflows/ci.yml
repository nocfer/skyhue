name: CI

# Esegue i test dell'algoritmo a ogni push / PR. Non tocca il deploy (Pages usa
# "deploy from a branch"): serve solo a garantire che la logica resti corretta.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test
