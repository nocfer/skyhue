name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sunset-score-app-ixk800]
  workflow_dispatch:

# Permessi necessari al deploy su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Abilita GitHub Pages automaticamente (enablement: true), così non
      # serve alcuna configurazione manuale nelle impostazioni del repo.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # L'app è statica alla root del repo: pubblichiamo l'intera cartella.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
