<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyHue · Sunset Score</title>
    <meta
      name="description"
      content="Calcola il Sunset Score della tua località combinando meteo in tempo reale e dati astronomici."
    />
    <meta name="theme-color" content="#0e0b11" />
    <script>
      // Applica il tema salvato (o quello di sistema) prima del paint, così non
      // c'è flash. Il toggle in pagina aggiorna localStorage.
      (function () {
        try {
          var t = localStorage.getItem('skyhue.theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="sky"></div>
    <main class="app" id="app-view">
      <header class="hero">
        <nav class="topnav">
          <a href="#map" class="navlink">
            <svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.11 5.55a2 2 0 0 0 1.78 0l3.66-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.55 2.27a2 2 0 0 1-1.79 0l-4.21-2.1a2 2 0 0 0-1.79 0l-3.66 1.82A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9l4.55-2.27a2 2 0 0 1 1.79 0z"/><path d="M15 5.76v15"/><path d="M9 3.24v15"/></svg>
            Scegli sulla mappa
          </a>
          <button id="theme-toggle" class="navlink theme-toggle" type="button" title="Tema chiaro / scuro" aria-label="Cambia tema"></button>
        </nav>
        <h1>
          <svg class="ico hero__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10V2"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m16 6-4 4-4-4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg>
          <span class="hero__word">SkyHue</span>
        </h1>
        <p class="tagline">
          Quanto sarà bello il prossimo tramonto? Un punteggio da meteo reale e dati astronomici.
        </p>

        <form id="search-form" class="search">
          <input
            id="search-input"
            type="text"
            placeholder="Cerca una città (es. Napoli, Lisbona…)"
            autocomplete="off"
            aria-label="Cerca una città"
          />
          <button type="submit">Calcola</button>
          <button type="button" id="geo-btn" class="ghost" title="Usa la mia posizione">
            <svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            Posizione
          </button>
        </form>

        <div class="modes" role="group" aria-label="Momento della giornata">
          <button type="button" class="mode mode--active" data-event="sunset">
            <svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10V2"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m16 6-4 4-4-4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg>
            Tramonto
          </button>
          <button type="button" class="mode" data-event="sunrise">
            <svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg>
            Alba
          </button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div id="favorites" class="favorites" aria-label="Località preferite"></div>
      </header>

      <section id="results" class="results"></section>

      <footer class="foot">
        <p>
          Dati meteo &amp; astronomici da
          <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>.
          Posizione solare calcolata con l'algoritmo NOAA.
        </p>
      </footer>
    </main>

    <section id="map-view" class="mapview" hidden>
      <header class="mapview__bar">
        <button id="map-back" class="ghost">← Indietro</button>
        <span class="mapview__hint">Tocca un punto della mappa per valutarlo</span>
      </header>
      <div id="leaflet" class="mapview__canvas"></div>
      <div id="map-panel" class="mapview__panel" hidden></div>
    </section>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/map.js"></script>
    <script>
      // Registra il service worker (offline / installazione) e aggiorna la vista
      // in automatico quando viene pubblicata una nuova versione.
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        // C'è già un SW al controllo? Se sì, un cambio di controller = update:
        // ricarica una volta. Al primissimo install (nessun controller) non fa nulla.
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing || !hadController) return;
          refreshing = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => reg.update()) // controlla subito se c'è una versione nuova
            .catch((err) => console.warn('Service worker non registrato:', err));
        });
      }
    </script>
  </body>
</html>
