<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyHue · Sunset Score</title>
    <meta
      name="description"
      content="Calcola il Sunset Score della tua località combinando meteo in tempo reale e dati astronomici."
    />
    <meta name="theme-color" content="#d9663f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="sky"></div>
    <main class="app" id="app-view">
      <header class="hero">
        <nav class="topnav">
          <a href="#map" class="navlink">🗺️ Scegli sulla mappa</a>
        </nav>
        <h1><span class="hero__emoji">🌅</span> <span class="hero__word">SkyHue</span></h1>
        <p class="tagline">
          Quanto sarà bello il prossimo tramonto? Un punteggio da meteo reale e dati astronomici.
        </p>

        <form id="search-form" class="search">
          <input
            id="search-input"
            type="text"
            placeholder="Cerca una città (es. Napoli, Lisbona…)"
            autocomplete="off"
            aria-label="Cerca una città"
          />
          <button type="submit">Calcola</button>
          <button type="button" id="geo-btn" class="ghost" title="Usa la mia posizione">
            📍 Posizione
          </button>
        </form>

        <div class="modes" role="group" aria-label="Momento della giornata">
          <button type="button" class="mode mode--active" data-event="sunset">🌅 Tramonto</button>
          <button type="button" class="mode" data-event="sunrise">🌄 Alba</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div id="favorites" class="favorites" aria-label="Località preferite"></div>
      </header>

      <section id="results" class="results"></section>

      <footer class="foot">
        <p>
          Dati meteo &amp; astronomici da
          <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>.
          Posizione solare calcolata con l'algoritmo NOAA.
        </p>
      </footer>
    </main>

    <section id="map-view" class="mapview" hidden>
      <header class="mapview__bar">
        <button id="map-back" class="ghost">← Indietro</button>
        <span class="mapview__hint">Tocca un punto della mappa per valutarlo</span>
      </header>
      <div id="leaflet" class="mapview__canvas"></div>
      <div id="map-panel" class="mapview__panel" hidden></div>
    </section>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/map.js"></script>
    <script>
      // Registra il service worker (offline / installazione) e aggiorna la vista
      // in automatico quando viene pubblicata una nuova versione.
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        // C'è già un SW al controllo? Se sì, un cambio di controller = update:
        // ricarica una volta. Al primissimo install (nessun controller) non fa nulla.
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing || !hadController) return;
          refreshing = true;
          window.location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .then((reg) => reg.update()) // controlla subito se c'è una versione nuova
            .catch((err) => console.warn('Service worker non registrato:', err));
        });
      }
    </script>
  </body>
</html>
